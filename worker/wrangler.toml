name = "mb-ai-console"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://mairon2812.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5510"

# Límite por visitante: 5 preguntas por minuto por IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# El secreto GEMINI_API_KEY se crea con:  npx wrangler secret put GEMINI_API_KEY
